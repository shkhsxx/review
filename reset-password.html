<!--
  reset-password.html — 비밀번호 재설정 페이지

  로그인 모달의 "비밀번호 찾기"에서 보낸 이메일 속 링크로만 정상 접근된다.
  Supabase 클라이언트(auth.js)가 URL에 담긴 복구 토큰을 자동으로 읽어 세션을
  만들어주므로, 이 페이지는 그 세션이 있는 동안만 새 비밀번호 입력 폼을 보여준다.

  구조
  ─────────────────────────────────────────────
  .reset-page
  ├─ .reset-header
  │  ├─ .reset-header__back
  │  ├─ .reset-header__title
  │  └─ .reset-header__subtitle
  └─ .reset-panel
     ├─ .reset-panel__invalid   (링크가 만료/잘못된 경우만 표시, 기본 hidden)
     ├─ .reset-panel__form      (새 비밀번호 입력 폼)
     │  ├─ .reset-panel__input × 2 (새 비밀번호 / 확인)
     │  └─ .reset-panel__error
     └─ .reset-panel__success   (변경 완료 후 표시, 기본 hidden)
  ─────────────────────────────────────────────
-->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>비밀번호 재설정 | 오늘뭐먹지</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="reset-password.css" />
</head>
<body>
<div class="reset-page">
  <header class="reset-header">
    <a class="reset-header__back" href="index.html">← 홈으로</a>
    <h1 class="reset-header__title">새 비밀번호 설정</h1>
    <p class="reset-header__subtitle">이메일로 받은 링크로 접속하셨어요. 새 비밀번호를 입력해주세요.</p>
  </header>

  <section class="reset-panel">
    <p class="reset-panel__invalid" id="reset-invalid" hidden>
      링크가 만료되었거나 올바르지 않아요. 로그인 팝업의 "비밀번호 찾기"에서 다시 요청해주세요.
    </p>

    <form class="reset-panel__form" id="reset-form" novalidate>
      <label class="reset-panel__label" for="reset-password-input">새 비밀번호</label>
      <input class="reset-panel__input" type="password" id="reset-password-input" autocomplete="new-password" minlength="6" required>
      <label class="reset-panel__label" for="reset-confirm-input">새 비밀번호 확인</label>
      <input class="reset-panel__input" type="password" id="reset-confirm-input" autocomplete="new-password" minlength="6" required>
      <p class="reset-panel__error" id="reset-error" hidden></p>
      <button type="submit" class="btn btn-primary" id="reset-submit-btn">비밀번호 변경</button>
    </form>

    <div class="reset-panel__success" id="reset-success" hidden>
      <p>비밀번호가 변경됐어요.</p>
      <a class="btn btn-primary" href="index.html">홈으로 가기</a>
    </div>
  </section>
</div>

<script type="module" src="reset-password.js"></script>
</body>
</html>
