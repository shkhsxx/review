<!--
  save.html — "맛집 담기" 페이지

  ※ design 팀원 조율용 안내 ※
  이 파일은 logic 팀원(server.py / save.js / auth.js / saved-places.js 담당)이 작성했으며,
  style.css / save.css / DESIGN.md 는 design 팀원 소유이므로 이 파일에는
  class명만 부여하고 스타일은 전혀 넣지 않았습니다. 아래 class 구조를 기준으로
  save.css에서 스타일링해주시면 됩니다.

  최상위 구조
  ─────────────────────────────────────────────
  .save-page                     페이지 전체 래퍼
  ├─ .save-header                페이지 상단 타이틀 영역
  │  ├─ .save-header__top         (뒤로가기 링크 + 로그인 위젯을 담는 상단 행)
  │  │  ├─ .save-header__back
  │  │  └─ .auth-slot             (auth-widget.js가 로그인 버튼/로그인 상태를 렌더링)
  │  ├─ .save-header__title
  │  └─ .save-header__subtitle
  │
  ├─ .search-panel                검색 입력 + 필터 영역
  │  ├─ .search-panel__form       (form, submit 시 검색 실행)
  │  │  ├─ .search-panel__input   키워드 검색 input
  │  │  ├─ .search-panel__select  카테고리 필터 select
  │  │  └─ .search-panel__submit  검색 버튼
  │  └─ .search-panel__status     로딩/에러/안내 메시지 표시 (텍스트만 교체됨)
  │
  ├─ .search-results               검색 결과 리스트 영역
  │  ├─ .search-results__title
  │  ├─ .search-results__hint      카드 클릭하면 리뷰/AI 분석이 열린다는 안내(정적 텍스트)
  │  └─ .place-card-list           카드들을 담는 컨테이너 (JS가 .place-card를 채워넣음)
  │     └─ .place-card             (JS가 동적으로 생성하는 카드 — 아래 구조 참고)
  │        ├─ .place-card__source      (span, "카카오" / "구글" 출처 표시)
  │        ├─ .place-card__name
  │        ├─ .place-card__category
  │        ├─ .place-card__address
  │        ├─ .place-card__phone       (전화번호 없으면 렌더링 안 함, 구글 결과는 항상 없음)
  │        ├─ .place-card__rating      (평점, 구글 결과에만 있을 때 렌더링)
  │        ├─ .place-card__link        (a 태그, 카카오 플레이스/구글 지도 링크)
  │        └─ .place-card__save-btn    (button, "담기" / "담음" 토글)
  │
  │     ※ 검색 결과는 카카오 로컬 API + 구글 플레이스 API(Text Search) 결과를 합쳐서
  │        같은 .place-card-list 안에 렌더링합니다. data-source 속성("kakao"/"google")으로
  │        카드의 출처를 구분할 수 있습니다.
  │     ※ .place-card 자체를 클릭하면(저장 버튼/링크 클릭은 제외) 아래 .review-panel이
  │        열리고 그 가게의 구글 리뷰를 보여줍니다.
  │
  ├─ .review-panel                 가게 리뷰 보기 패널 (기본 hidden, 카드 클릭 시 표시)
  │  ├─ .review-panel__header       이름 + 닫기 버튼을 담는 상단 행
  │  │  ├─ .review-panel__name      가게 이름
  │  │  └─ .review-panel__close-btn (button, 패널 닫기)
  │  ├─ .review-panel__rating       평점 + 리뷰 개수 요약 텍스트 (예: "★ 4.5 (리뷰 128개)")
  │  ├─ .review-panel__loading      "리뷰를 불러오는 중..." 로딩 문구 (JS가 표시/숨김 토글)
  │  ├─ .review-panel__not-found    가게를 못 찾았을 때 / 조회 실패 시 안내 문구 (JS가 표시/숨김 토글 + 텍스트 교체)
  │  ├─ .review-panel__list         리뷰 목록 컨테이너 (JS가 .review-item을 채워넣음)
  │  │  └─ .review-item             리뷰 한 건 (JS가 동적으로 생성 — 아래 구조 참고)
  │  │     ├─ .review-item__author    작성자
  │  │     ├─ .review-item__rating    별점 (예: "★ 5")
  │  │     ├─ .review-item__date      작성 시점 (구글이 내려주는 상대 시간 문자열, 예: "2개월 전")
  │  │     └─ .review-item__content   리뷰 내용
  │  ├─ .review-panel__map-link     (a 태그, 구글 지도에서 전체 리뷰 보기 — 결과 없으면 숨김)
  │  └─ .review-panel__analysis     AI 감성분석 영역 (리뷰가 1건 이상일 때만 표시)
  │     ├─ .review-panel__analysis-toggle   "AI 리뷰 분석 보기"/"접기" 토글 버튼(JS가 텍스트 교체)
  │     └─ .review-panel__analysis-body     토글로 펼침/접힘(JS가 hidden 토글). 리뷰가 다 뜨면
  │        │                               분석 자체는 버튼과 무관하게 자동으로 백그라운드 시작되고,
  │        │                               결과는 버튼을 눌러야 이 영역이 펼쳐지며 보인다.
  │        ├─ .review-panel__analysis-loading   "리뷰를 분석하고 있어요..." 로딩 문구 (JS가 토글)
  │        ├─ .review-panel__analysis-error     분석 실패 안내 문구 (JS가 토글 + 텍스트 교체)
  │        └─ .review-panel__analysis-content   분석 결과 (JS가 토글)
  │           ├─ .sentiment-bar          긍정/보통/부정 비율 막대(초록/노랑/빨강, 개수 비례 너비)
  │           │  ├─ .sentiment-bar__segment--positive
  │           │  ├─ .sentiment-bar__segment--neutral
  │           │  └─ .sentiment-bar__segment--negative
  │           ├─ .sentiment-legend       막대 아래 범례("긍정 3", "보통 1", "부정 1" 형태)
  │           ├─ .word-cloud             핵심 단어 워드클라우드 컨테이너
  │           │  └─ .word-cloud__item    단어 1개(JS가 동적 생성). score(1~10)에 비례해 font-size를
  │           │                          inline style로 지정하고, sentiment에 따라
  │           │                          .word-cloud__item--positive(초록)/--negative(빨강) 클래스를 붙인다.
  │           └─ .analysis-summary       AI 총평 한 줄 (말풍선 스타일)
  │
  └─ .saved-list                   담은 목록 영역
     ├─ .saved-list__title
     ├─ .saved-list__empty         목록이 비어있을 때 안내 문구 (JS가 표시/숨김 토글)
     └─ .saved-list__items         (JS가 .saved-item을 채워넣음)
        └─ .saved-item             (JS가 동적으로 생성하는 항목 — 아래 구조 참고)
           ├─ .saved-item__name
           ├─ .saved-item__address
           └─ .saved-item__remove-btn  (button, 목록에서 제거)
  ─────────────────────────────────────────────

  data-* 속성:
  - .place-card, .saved-item 에는 각각 data-place-id 속성을 부여해
    JS에서 담기/제거 대상 식별에 사용합니다. (saved_places 테이블의 place_id와 동일한
    "kakao-<id>" | "google-<id>" 형식. 스타일링에는 사용되지 않음)
  - .place-card 에는 data-source 속성("kakao" | "google")도 부여됩니다.
    (식별용이지만 필요하면 [data-source="google"] 처럼 선택자로 스타일링에
    활용하셔도 됩니다.)

  .review-panel 관련 참고:
  - /api/place-reviews (구글 Places API (New) 프록시)를 호출해 별점/리뷰/구글맵 링크를
    가져옵니다. 같은 가게를 다시 클릭하면 재요청 없이 캐시된 값을 바로 보여줍니다.
  - 좌표 기준 150m(도보 2분) 밖에서 찾은 동명(同名) 결과는 무시하고, 아예 못 찾으면
    .review-panel__not-found 문구만 보여주고 .review-panel__list/.review-panel__map-link는
    비워/숨김 처리합니다.

  .review-panel__analysis 관련 참고:
  - 리뷰가 1건 이상 있는 가게만 대상으로, 리뷰 렌더링이 끝나면 자동으로
    /api/analyze-reviews (Gemini API 프록시)를 호출해 감성분석 결과를 보여줍니다.
    리뷰가 0건이거나 가게를 못 찾은 경우 .review-panel__analysis 자체가 hidden 처리됩니다.
  - 분석 결과도 sessionStorage에 캐시되어 같은 가게를 다시 클릭하면 재요청하지 않습니다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>맛집 담기 | 오늘뭐먹지</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="save.css" />
</head>
<body>
<div class="save-page">
  <header class="save-header">
    <div class="save-header__top">
      <div class="save-header__top-left">
        <a class="save-header__back" href="index.html">← 홈으로</a>
        <a class="btn btn-ghost btn-sm" href="mypage.html" id="pocket-link" hidden>맛집주머니</a>
      </div>
      <div class="auth-slot" id="auth-slot"></div>
    </div>
    <h1 class="save-header__title">맛집 담기</h1>
    <p class="save-header__subtitle">키워드로 가게를 검색하고, 마음에 든 곳을 담아보세요.</p>
  </header>

  <section class="search-panel" aria-label="맛집 검색">
    <form class="search-panel__form" id="search-form">
      <input
        type="text"
        name="query"
        class="search-panel__input"
        id="search-input"
        placeholder="가게 이름, 지역, 음식 종류로 검색"
        autocomplete="off"
        required
      />
      <select class="search-panel__select" id="category-select" name="category_group_code">
        <option value="FD6">음식점</option>
        <option value="CE7">카페</option>
      </select>
      <button type="submit" class="search-panel__submit">검색</button>
    </form>
    <p class="search-panel__status" id="search-status" role="status"></p>
  </section>

  <section class="search-results" aria-label="검색 결과">
    <h2 class="search-results__title">검색 결과</h2>
    <p class="search-results__hint">카드를 눌러보면 리뷰와 AI 분석을 볼 수 있어요.</p>
    <div class="place-card-list" id="place-card-list">
      <!-- save.js가 검색 결과에 따라 .place-card 를 여기에 렌더링합니다 -->
    </div>
  </section>

  <section class="review-panel" aria-label="가게 리뷰 보기" id="review-panel" hidden>
    <div class="review-panel__header">
      <h2 class="review-panel__name" id="review-panel-name"></h2>
      <button type="button" class="review-panel__close-btn" id="review-panel-close-btn">닫기</button>
    </div>
    <p class="review-panel__rating" id="review-panel-rating"></p>
    <p class="review-panel__loading" id="review-panel-loading" hidden>리뷰를 불러오는 중...</p>
    <p class="review-panel__not-found" id="review-panel-not-found" hidden>구글에서 이 가게를 찾을 수 없어요.</p>
    <div class="review-panel__list" id="review-panel-list">
      <!-- save.js가 조회한 리뷰 데이터를 기반으로 .review-item 을 여기에 렌더링합니다 -->
    </div>
    <a
      class="review-panel__map-link"
      id="review-panel-map-link"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      hidden
      >구글 지도에서 전체 리뷰 보기</a
    >

    <div class="review-panel__analysis" id="review-panel-analysis" hidden>
      <button
        type="button"
        class="review-panel__analysis-toggle"
        id="review-panel-analysis-toggle"
        aria-expanded="false"
      >
        AI 리뷰 분석 보기
      </button>
      <div class="review-panel__analysis-body" id="review-panel-analysis-body" hidden>
        <p class="review-panel__analysis-loading" id="review-panel-analysis-loading" hidden>
          리뷰를 분석하고 있어요...
        </p>
        <p class="review-panel__analysis-error" id="review-panel-analysis-error" hidden></p>
        <div class="review-panel__analysis-content" id="review-panel-analysis-content" hidden>
          <div class="sentiment-bar" id="sentiment-bar">
            <div class="sentiment-bar__segment sentiment-bar__segment--positive" id="sentiment-bar-positive"></div>
            <div class="sentiment-bar__segment sentiment-bar__segment--neutral" id="sentiment-bar-neutral"></div>
            <div class="sentiment-bar__segment sentiment-bar__segment--negative" id="sentiment-bar-negative"></div>
          </div>
          <ul class="sentiment-legend" id="sentiment-legend">
            <li class="sentiment-legend__item sentiment-legend__item--positive">
              긍정 <span id="sentiment-count-positive"></span>
            </li>
            <li class="sentiment-legend__item sentiment-legend__item--neutral">
              보통 <span id="sentiment-count-neutral"></span>
            </li>
            <li class="sentiment-legend__item sentiment-legend__item--negative">
              부정 <span id="sentiment-count-negative"></span>
            </li>
          </ul>
          <div class="word-cloud" id="word-cloud">
            <!-- save.js가 분석된 핵심 단어를 기반으로 .word-cloud__item 을 여기에 렌더링합니다 -->
          </div>
          <p class="analysis-summary" id="analysis-summary"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="saved-list" aria-label="담은 맛집 목록">
    <h2 class="saved-list__title">담은 맛집</h2>
    <p class="saved-list__empty" id="saved-list-empty">아직 담은 맛집이 없어요.</p>
    <div class="saved-list__items" id="saved-list-items">
      <!-- save.js가 localStorage 데이터를 기반으로 .saved-item 을 여기에 렌더링합니다 -->
    </div>
  </section>
</div>

<script type="module" src="auth-widget.js"></script>
<script type="module" src="tabbar.js"></script>
<script type="module" src="save.js"></script>
<script type="module">
  import { onAuthChange } from "./auth.js";
  const pocketLink = document.getElementById("pocket-link");
  onAuthChange((user) => { pocketLink.hidden = !user; });
</script>
</body>
</html>
